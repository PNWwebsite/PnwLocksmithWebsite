<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PNW Lock and Key — 24/7 Locksmith in Tigard, OR | (971) 666-8193</title>
    <meta
      name="description"
      content="Licensed 24/7 emergency locksmith based in Tigard, Oregon, serving Portland and surrounding communities. Residential, commercial and automotive lock and key service. License #70530CLS. Call (971) 666-8193."
    />
    <meta name="theme-color" content="#0D2544" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <meta property="og:title" content="PNW Lock and Key — 24/7 Locksmith in Tigard, OR" />
    <meta
      property="og:description"
      content="Licensed, bonded and insured locksmiths. Residential, commercial and automotive. Answering the phone around the clock."
    />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      Fonts are loaded without blocking render: the stylesheet is fetched with
      media="print" so it is not render-blocking, then switched to all on load.
      The noscript copy covers scripting-disabled clients.
      The width axis was dropped when font-stretch left the stylesheet.
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap"
      />
    </noscript>

    <!-- LCP image: preloaded so it is discoverable before React renders -->
    <link
      rel="preload"
      as="image"
      href="/hero/hero-tech-1400.webp"
      imagesrcset="/hero/hero-tech-800.webp 800w, /hero/hero-tech-1400.webp 1400w"
      imagesizes="100vw"
      fetchpriority="high"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Locksmith",
        "name": "PNW Lock and Key",
        "telephone": "+1-971-666-8193",
        "url": "https://pnwlockandkey.com",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "8920 SW Oak St 300B",
          "addressLocality": "Tigard",
          "addressRegion": "OR",
          "postalCode": "97223",
          "addressCountry": "US"
        },
        "geo": { "@type": "GeoCoordinates", "latitude": 45.4437, "longitude": -122.7793 },
        "openingHoursSpecification": {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": [
            "Monday",
            "Tuesday",
            "Wednesday",
            "Thursday",
            "Friday",
            "Saturday",
            "Sunday"
          ],
          "opens": "00:00",
          "closes": "23:59"
        },
        "areaServed": {
          "@type": "GeoCircle",
          "geoMidpoint": { "@type": "GeoCoordinates", "latitude": 45.4437, "longitude": -122.7793 },
          "geoRadius": "32186"
        },
        "priceRange": "$$"
      }
    </script>
  </head>
  <body>
    <!--
      Netlify Forms detection stub. Netlify scans the built HTML for forms at
      deploy time, and a React-rendered form is not present then. This hidden
      form declares the name and fields; ContactForm.jsx posts to it.
      Keep the field names here in sync with the ones in ContactForm.jsx.
    -->
    <form name="callback" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="text" name="city" />
      <input type="text" name="service" />
      <textarea name="message"></textarea>
      <input type="text" name="source" />
      <input type="text" name="bot-field" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
